<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1c2b1f" />
    <title>River Run</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1c2b1f;
        touch-action: none;
        overscroll-behavior: none;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
    </style>
  <style>

        #sq-open {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        #sq-open.is-off { display: none !important; }
        #sq-open .sq-stage {
            position: relative;
            width: min(100%, 1400px);
            max-height: 100%;
            max-height: 100dvh;
        }
        #sq-open .sq-art {
            display: block;
            width: 100%;
            height: auto;
            max-height: 100dvh;
            object-fit: contain;
        }
        #sq-open.pixel .sq-art {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #sq-open .sq-play {
            position: absolute;
            left: 50%;
            bottom: 8%;
            transform: translateX(-50%);
            background: none;
            border: 0;
            padding: 12px 16px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #sq-open .sq-play img {
            display: block;
            width: 276px;
            height: 87px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;
            pointer-events: none;
        }
        @media (max-width: 640px) {
            #sq-open .sq-play img { width: 184px; height: 58px; }
        }

        #sq-open .sq-continue {
            position: absolute;
            left: 50%;
            bottom: 8%;
            transform: translateX(-50%);
            background: #fff6eb;
            color: #3b2a1a;
            border: 4px solid #8b4e1f;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(16px, 4vw, 22px);
            font-weight: 700;
            letter-spacing: 0.03em;
            padding: 12px 22px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #sq-open .sq-howto {
            display: none;
            width: min(100%, 560px);
            max-height: 92dvh;
            overflow: auto;
            box-sizing: border-box;
            padding: 8px;
        }
        #sq-open.is-howto .sq-stage { display: none; }
        #sq-open.is-howto .sq-howto { display: block; }
        #sq-open .sq-howto-card {
            background: #fff6eb;
            color: #3b2a1a;
            border: 4px solid #8b4e1f;
            padding: 22px 20px 16px;
            text-align: center;
            box-sizing: border-box;
        }
        #sq-open .sq-howto-card h2 {
            margin: 0 0 12px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(22px, 5vw, 30px);
            line-height: 1.2;
        }
        #sq-open .sq-howto-card p {
            margin: 0 0 10px;
            font-size: clamp(15px, 3.6vw, 18px);
            line-height: 1.45;
            text-align: left;
        }
        #sq-open.is-howto .sq-play {
            position: static;
            transform: none;
            margin: 10px auto 0;
            display: inline-block;
        }

        #sq-open .sq-studio {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #fff6eb;
            background: rgba(26, 18, 12, 0.78);
            border: 2px solid #e8a838;
            padding: 4px 8px 4px 4px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
        }
        #sq-open .sq-studio svg {
            display: block;
            width: 22px;
            height: 22px;
            flex: none;
        }



</style>
</head>
  <body>
<div id="sq-open" role="dialog" aria-modal="true" aria-label="River Run">
    <a class="sq-studio" href="https://snackquests.com" id="sq-studio">
    <svg viewBox="0 0 64 64" width="22" height="22" aria-hidden="true" focusable="false">
      <ellipse cx="32" cy="38" rx="20" ry="14" fill="#E8A838"/>
      <ellipse cx="32" cy="34" rx="18" ry="11" fill="#F4B942"/>
      <circle cx="24" cy="34" r="2.2" fill="#3B2A1A"/>
      <circle cx="40" cy="34" r="2.2" fill="#3B2A1A"/>
      <path d="M26 40c2 2.4 10 2.4 12 0" fill="none" stroke="#3B2A1A" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>Snack Quests</span>
  </a>
<div class="sq-stage" id="sq-art-screen">
    <img class="sq-art" src="/River-Run/opening.jpg" alt="River Run">
    <button type="button" class="sq-continue" id="sq-continue">Tap to continue</button>
  </div>
  <div class="sq-howto" id="sq-howto">
    <div class="sq-howto-card">
      <h2>How to play</h2>
      <p>Build a town by the river.</p>
      <button type="button" class="sq-play" id="sq-play" aria-label="Play">
        <img src="/River-Run/btn_play.png" alt="PLAY" width="92" height="29">
      </button>
    </div>
  </div>
</div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  
<script>
(function () {
  var overlay = document.getElementById('sq-open');
  var cont = document.getElementById('sq-continue');
  var btn = document.getElementById('sq-play');
  var stage = overlay && overlay.querySelector('.sq-stage');
  if (!overlay) return;
  function goHowto(e) {
    if (overlay.classList.contains('is-howto') || overlay.classList.contains('is-off')) return;
    if (e) { e.preventDefault(); e.stopPropagation(); }
    overlay.classList.add('is-howto');
  }
  function start(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    overlay.classList.add('is-off');
    overlay.setAttribute('aria-hidden', 'true');
    if (typeof gameState !== 'undefined' && gameState === 'TITLE') {
      gameState = 'PLAYING';
    }
    document.dispatchEvent(new CustomEvent('sq-play'));
  }
  if (cont) cont.addEventListener('click', goHowto);
  if (stage) stage.addEventListener('click', goHowto);
  if (btn) btn.addEventListener('click', start);
  window.addEventListener('keydown', function (e) {
    if (overlay.classList.contains('is-off')) return;
    if (e.code === 'Enter' || e.code === 'Space') {
      if (overlay.classList.contains('is-howto')) start(e);
      else goHowto(e);
    }
  }, true);
})();
</script>

</body>
</html>
